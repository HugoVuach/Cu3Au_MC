[project]
name = "cu3au-montecarlo"
version = "1.0.0"
description = "Transition ordre-desordre Cu3Au sur reseau CFC rigide"
requires-python = ">=3.11"
dependencies = ["numpy==2.3.5", "scipy==1.17.0", "matplotlib==3.10.8", "numba==0.68.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["cu3au*"]
